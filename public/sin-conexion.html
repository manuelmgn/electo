<!doctype html>
<html lang="gl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Electo 26</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f6fb;
        color: #1a1b2b;
        text-align: center;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b0e15;
          color: #e7eaf2;
        }
      }
      .card {
        max-width: 20rem;
        padding: 2rem 1.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(128, 128, 128, 0.25);
        background: rgba(128, 128, 128, 0.06);
      }
      .emoji {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.1rem;
        margin: 0 0 0.35rem;
      }
      p {
        font-size: 0.85rem;
        opacity: 0.7;
        margin: 0 0 1.25rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.55rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: #ff4d67;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="emoji" aria-hidden="true">📡</span>
      <h1>Sen conexión</h1>
      <p>Non se puido cargar a páxina. Comproba a túa conexión e inténtao de novo.</p>
      <button onclick="location.reload()">Volver tentalo</button>
    </main>
  </body>
</html>
